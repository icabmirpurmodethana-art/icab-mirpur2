<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ঐতিহাসিক চরমোনাই মাহফিল - ফ্রেম জেনারেটর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body {
            background-color: #f0f2f5;
            font-family: 'Hind Siliguri', sans-serif;
        }
        .canvas-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: #e2e8f0;
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        @media (min-width: 400px) {
            .canvas-container {
                width: 360px;
                height: 360px;
            }
        }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex flex-col items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-5 text-center">
        <h1 class="text-lg font-bold text-red-900 mb-1">ঐতিহাসিক চরমোনাই মাহফিল</h1>
        <p class="text-xs text-gray-500 mb-3">২৫, ২৬ ও ২৭ নভেম্বর - ফ্রেম মেকার</p>

        <!-- Preview Area -->
        <div class="canvas-container mb-3" id="canvasBox">
            <canvas id="frameCanvas" width="800" height="800" class="w-full h-full object-cover"></canvas>
        </div>
        <p class="text-[11px] text-gray-400 mb-4">💡 ছবিতে আঙুল দিয়ে ডানে-বায়ে বা উপরে-নিচে সরিয়ে পজিশন ঠিক করুন</p>

        <!-- Controls -->
        <div class="space-y-3 mb-4 text-left bg-gray-50 p-3 rounded-xl border border-gray-100">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">আপনার ছবি সিলেক্ট করুন:</label>
                <input type="file" id="imageUpload" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between text-xs font-semibold text-gray-700 mb-1">
                    <span>জুম করুন (ছোট/বড়):</span>
                </div>
                <input type="range" id="zoomRange" min="0.4" max="3" step="0.02" value="1" class="w-full accent-red-700">
            </div>
        </div>

        <!-- Download Button -->
        <button id="downloadBtn" class="w-full bg-[#990000] hover:bg-[#7a0000] text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            ফ্রেমসহ ছবি ডাউনলোড করুন
        </button>
    </div>

    <!-- Script -->
    <script>
        const canvas = document.getElementById('frameCanvas');
        const ctx = canvas.getContext('2d');
        const imageUpload = document.getElementById('imageUpload');
        const zoomRange = document.getElementById('zoomRange');
        const downloadBtn = document.getElementById('downloadBtn');
        const canvasBox = document.getElementById('canvasBox');

        let userImage = null;
        let imgX = 400;
        let imgY = 250;
        let scale = 1;
        let isDragging = false;
        let startX, startY;

        // ডিফল্ট ডেমো ছবি লোড
        let loadedUserImg = new Image();
        loadedUserImg.crossOrigin = "anonymous";
        loadedUserImg.src = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800';
        loadedUserImg.onload = () => {
            userImage = loadedUserImg;
            drawImage();
        };

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        userImage = img;
                        scale = 1;
                        zoomRange.value = 1;
                        imgX = 400;
                        imgY = 250;
                        drawImage();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        zoomRange.addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
            drawImage();
        });

        // মাউস ও টাচ ড্র্যাগ ইভেন্ট
        function startDrag(clientX, clientY) {
            isDragging = true;
            startX = clientX - imgX;
            startY = clientY - imgY;
        }

        function onDrag(clientX, clientY) {
            if (!isDragging) return;
            imgX = clientX - startX;
            imgY = clientY - startY;
            drawImage();
        }

        canvasBox.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => onDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => { isDragging = false; });

        canvasBox.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                startDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            onDrag(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        function drawImage() {
            ctx.clearRect(0, 0, 800, 800);

            if (userImage) {
                ctx.save();
                // ওপরের ছবির জন্য বক্স আকৃতির ক্লিপিং এরিয়া (রেকটেঙ্গেল উইথ কর্নার রেডিয়াস)
                ctx.beginPath();
                ctx.roundRect(40, 40, 720, 480, 20);
                ctx.closePath();
                ctx.clip();

                ctx.translate(imgX, imgY);
                ctx.scale(scale, scale);
                ctx.drawImage(userImage, -userImage.width / 2, -userImage.height / 2);
                ctx.restore();
            }

            drawExactReferenceFrame();
        }

        function drawExactReferenceFrame() {
            // ১. নিচের লাল রঙের মূল ব্যানার ব্যাকগ্রাউন্ড
            ctx.fillStyle = '#8b0000';
            ctx.fillRect(0, 480, 800, 320);

            // ২. বাঁ পাশের সাদা প্যানেল (তারিখ ও সময়ের জন্য)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(40, 520, 200, 240, 15);
            ctx.fill();

            // বাঁ পাশের টেক্সট (তারিখ ও সময়)
            ctx.fillStyle = '#990000';
            ctx.font = '700 48px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('২৫-২৭', 140, 585);

            ctx.fillStyle = '#222222';
            ctx.font = '600 24px "Hind Siliguri", sans-serif';
            ctx.fillText('নভেম্বর ২০২৬', 140, 625);

            ctx.font = '600 20px "Hind Siliguri", sans-serif';
            ctx.fillStyle = '#555555';
            ctx.fillText('শুরু বুধবার', 140, 665);
            ctx.fillText('বেলা ২টা', 140, 695);

            // ৩. মাঝখানের মূল শিরোনাম (ঐতিহাসিক চরমোনাই মাহফিল)
            ctx.fillStyle = '#ffffff';
            ctx.font = '700 62px "Hind Siliguri", sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 12;
            ctx.fillText('ঐতিহাসিক চরমোনাই', 510, 585);
            ctx.fillText('মাহফিল', 510, 660);
            ctx.shadowBlur = 0; // শ্যাডো রিসেট

            // ৪. একদম নিচের স্থান ও ফুটার টেক্সট
            ctx.fillStyle = '#fde047';
            ctx.font = '700 26px "Hind Siliguri", sans-serif';
            ctx.fillText('স্থান: চরমোনাই দরবার শরীফ, বরিশাল', 510, 725);
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'Itihashik-Charmonai-Mahfil-Frame.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কেন্দ্রীয় সম্মেলন ২০২৭ - প্রোফাইল ফ্রেম মেকার</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=SolaimanLipi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'SolaimanLipi', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex flex-col items-center justify-between p-4">

    <!-- Header Section -->
    <header class="w-full max-w-md text-center py-3">
        <h1 class="text-2xl font-bold text-amber-400">কেন্দ্রীয় সম্মেলন ২০২৭ ফ্রেম মেকার</h1>
        <p class="text-xs text-gray-400 mt-1">আপনার প্রোফাইল ছবি আপলোড করুন এবং ফ্রেমযুক্ত ছবি ডাউনলোড করুন</p>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl flex flex-col items-center gap-4">
        
        <!-- Frame Preview Canvas Area -->
        <div class="relative w-full aspect-square max-w-[380px] bg-slate-950 rounded-xl overflow-hidden shadow-inner border border-slate-700">
            <canvas id="twibbonCanvas" width="1000" height="1000" class="w-full h-full object-contain cursor-move"></canvas>
            
            <!-- Loading Indicator -->
            <div id="loader" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center text-white text-sm hidden">
                <svg class="animate-spin h-8 w-8 text-amber-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                ফ্রেম লোড হচ্ছে...
            </div>
        </div>

        <!-- Controls / Inputs -->
        <div class="w-full flex flex-col gap-3">
            <!-- Image Upload Button -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">আপনার ছবি নির্বাচন করুন:</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-955 hover:file:bg-amber-400 file:cursor-pointer cursor-pointer bg-slate-950 border border-slate-700 rounded-lg">
            </div>

            <!-- Image Position Adjustments -->
            <div class="grid grid-cols-2 gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">জুম করুন (<span id="zoomVal">100</span>%)</label>
                    <input type="range" id="zoomRange" min="40" max="250" value="100" class="w-full accent-amber-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">ঘূর্ণন (<span id="rotateVal">0</span>°)</label>
                    <input type="range" id="rotateRange" min="-180" max="180" value="0" class="w-full accent-amber-500 cursor-pointer">
                </div>
            </div>
            <p class="text-[11px] text-center text-gray-400">* আঙুল দিয়ে টেনে ছবি ওপর-নিচ বা ডানে-বামে ঠিক করে নিতে পারবেন</p>

            <!-- Action Buttons -->
            <div class="flex gap-3 pt-1">
                <button id="downloadBtn" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-center cursor-pointer disabled:opacity-50" disabled>
                    ছবি ডাউনলোড করুন 📥
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-3 text-xs text-gray-500">
        ইসলামী ছাত্র আন্দোলন বাংলাদেশ • প্রোফাইল ফ্রেম
    </footer>

    <!-- JavaScript for Canvas Rendering & Frame Composition -->
    <script>
        const canvas = document.getElementById('twibbonCanvas');
        const ctx = canvas.getContext('2d');
        const imageInput = document.getElementById('imageInput');
        const zoomRange = document.getElementById('zoomRange');
        const rotateRange = document.getElementById('rotateRange');
        const downloadBtn = document.getElementById('downloadBtn');
        const loader = document.getElementById('loader');

        let userImage = null;
        const CANVAS_SIZE = 1000;
        
        // বড় প্রোফাইল ছবির জন্য বৃত্তের মাপ ও অবস্থান (Large Circle for Profile Photo)
        const maskX = 500;
        const maskY = 415;
        const maskRadius = 385; // বৃত্তটি অনেক বড় করা হয়েছে যাতে পুরো প্রোফাইল ছবি সুন্দরভাবে দেখা যায়

        let imgState = {
            scale: 1,
            rotation: 0,
            offsetX: 0,
            offsetY: 0
        };

        function loadFrame() {
            loader.classList.remove('hidden');
            drawComposite();
            loader.classList.add('hidden');
        }

        function drawComposite() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // ১. বাইরের ব্যাকগ্রাউন্ড (ছবির বাইরের অংশ - আপনার ২য় ছবির মতো হালকা ধূসর-সাদা শেড)
            const outerGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_SIZE);
            outerGrad.addColorStop(0, '#cbd5e1');
            outerGrad.addColorStop(0.6, '#e2e8f0');
            outerGrad.addColorStop(1, '#cbd5e1');
            ctx.fillStyle = outerGrad;
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // ২. বড় বৃত্তের ভেতরে ইউজারের প্রোফাইল ছবি বসানো
            if (userImage) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(maskX, maskY, maskRadius, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.clip();

                // ছবির পেছনে সাদা ব্যাকগ্রাউন্ড
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                ctx.save();
                ctx.translate(maskX + imgState.offsetX, maskY + imgState.offsetY);
                ctx.rotate((imgState.rotation * Math.PI) / 180);
                ctx.scale(imgState.scale, imgState.scale);

                const drawWidth = userImage.width;
                const drawHeight = userImage.height;
                ctx.drawImage(userImage, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);

                ctx.restore();
                ctx.restore();
            } else {
                // ছবি আপলোড করার আগের প্লেসহোল্ডার বৃত্ত
                ctx.save();
                ctx.beginPath();
                ctx.arc(maskX, maskY, maskRadius, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.fillStyle = "#f8fafc";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#94a3b8";
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = "#475569";
                ctx.font = "bold 36px 'SolaimanLipi', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("আপনার প্রোফাইল ছবি এখানে বসবে", maskX, maskY - 20);
                ctx.font = "24px 'SolaimanLipi', sans-serif";
                ctx.fillStyle = "#64748b";
                ctx.fillText("(নিচ থেকে ছবি সিলেক্ট করুন)", maskX, maskY + 25);
            }

            // ৩. ফ্রেমের ওপরের ও নিচের লেখা এবং ডিজাইন
            drawOverlayGraphics();
        }

        function drawOverlayGraphics() {
            // ওপরে বাম পাশে: "□ মুক্তির মূলমন্ত্র[span_2](start_span)"[span_2](end_span)
            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 24px 'SolaimanLipi', sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("□ মুক্তির মূলমন্ত্র", 40, 55);

            // ওপরে ডান পাশে: "ইসলামী শাসনতন্ত্র □[span_3](start_span)"[span_3](end_span)
            ctx.textAlign = "right";
            ctx.fillText("ইসলামী শাসনতন্ত্র □", 960, 55);

            // নিচের মূল লাল ব্যানার বক্স (প্রোফাইল ছবির নিচের অংশে সুন্দরভাবে বসানো, যাতে মুখ ঢেকে না যায়)
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(45, 670);
            ctx.quadraticCurveTo(500, 625, 955, 670); // ওপরে হালকা কার্ভ ডিজাইন[span_4](start_span)[span_4](end_span)
            ctx.lineTo(955, 935);
            ctx.lineTo(45, 935);
            ctx.closePath();
            
            const redGrad = ctx.createLinearGradient(0, 640, 0, 935);
            redGrad.addColorStop(0, '#991b1b');
            redGrad.addColorStop(0.5, '#7f1d1d');
            redGrad.addColorStop(1, '#450a0a');
            ctx.fillStyle = redGrad;
            ctx.fill();
            ctx.restore();

            // বাম পাশের তারিখ ও স্থানের বক্স (সকাল ৯টা বাদ দেওয়া হয়েছে)
            ctx.fillStyle = "#5c0b0b";
            ctx.beginPath();
            ctx.roundRect(60, 680, 235, 235, 12);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 2;
            ctx.stroke();

            // তারিখ: ১১ ডিসেম্বর '২৬, শুক্রবার[span_5](start_span)[span_5](end_span)
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 54px 'SolaimanLipi', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("১১", 177, 735);

            ctx.font = "bold 24px 'SolaimanLipi', sans-serif";
            ctx.fillStyle = "#fde047";
            ctx.fillText("ডিসেম্বর '২৬", 177, 768);

            ctx.font = "19px 'SolaimanLipi', sans-serif";
            ctx.fillStyle = "#f1f5f9";
            ctx.fillText("শুক্রবার", 177, 795);

            // বিভাজক রেখা
            ctx.strokeStyle = "rgba(255,255,255,0.3)";
            ctx.beginPath();
            ctx.moveTo(90, 808);
            ctx.lineTo(265, 808);
            ctx.stroke();

            // স্থান: জাতীয় ক্রীড়া পরিষদ চত্বর, পল্টন, ঢাকা[span_6](start_span)[span_6](end_span)
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 19px 'SolaimanLipi', sans-serif";
            ctx.fillText("জাতীয় ক্রীড়া পরিষদ চত্বর", 177, 838);
            ctx.font = "bold 21px 'SolaimanLipi', sans-serif";
            ctx.fillStyle = "#fde047";
            ctx.fillText("পল্টন, ঢাকা", 177, 870);

            // মাঝখানের মূল শিরোনাম: "কেন্দ্রীয় সম্মেলন ২০২৭[span_7](start_span)"[span_7](end_span)
            ctx.fillStyle = "#fde047"; // সোনালী হলুদ রঙ
            ctx.font = "bold 76px 'SolaimanLipi', sans-serif";
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = 10;
            ctx.fillText("কেন্দ্রীয়", 500, 745);
            ctx.fillText("সম্মেলন", 500, 825);
            ctx.shadowBlur = 0;

            // সাল: ২০২৭[span_8](start_span)[span_8](end_span)
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 36px 'SolaimanLipi', sans-serif";
            ctx.fillText("২০২৭", 500, 875);

            // ডান পাশের সংগঠনের নাম ও তথ্য[span_9](start_span)[span_9](end_span)[span_10](start_span)[span_10](end_span)
            ctx.fillStyle = "#5c0b0b";
            ctx.beginPath();
            ctx.roundRect(705, 680, 235, 235, 12);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 25px 'SolaimanLipi', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("ইসলামী", 822, 725);
            ctx.font = "bold 29px 'SolaimanLipi', sans-serif";
            ctx.fillStyle = "#fde047";
            ctx.fillText("ছাত্র আন্দোলন", 822, 762);
            ctx.font = "bold 25px 'SolaimanLipi', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.fillText("বাংলাদেশ", 822, 798);

            // সোশ্যাল লিংক[span_11](start_span)[span_11](end_span)[span_12](start_span)[span_12](end_span)
            ctx.font = "14px sans-serif";
            ctx.fillStyle = "#e2e8f0";
            ctx.fillText("f icabd91  •  icabd91", 822, 845);
            ctx.font = "13px sans-serif";
            ctx.fillText("chhatraandolan.org", 822, 875);

            // একদম নিচের সাদা ফুটার বার (Twibbonize স্টাইল)[span_13](start_span)[span_13](end_span)
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.roundRect(660, 945, 300, 42, 20);
            ctx.fill();

            ctx.fillStyle = "#475569";
            ctx.font = "bold 17px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("Made with", 685, 972);

            ctx.fillStyle = "#0d9488";
            ctx.fillRect(775, 956, 18, 18);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(778, 959, 12, 12);

            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText("twibbonize", 800, 972);
        }

        // ছবি আপলোড হ্যান্ডলার
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    userImage = img;
                    // ছবি আপলোড হলে অটোমেটিক বৃত্তের মাপে ফিট হওয়ার জন্য প্রাথমিক স্কেল নির্ধারণ
                    const minSide = Math.min(img.width, img.height);
                    const initialScale = (maskRadius * 2) / minSide;
                    
                    imgState.scale = initialScale;
                    imgState.rotation = 0;
                    imgState.offsetX = 0;
                    imgState.offsetY = 0;
                    
                    zoomRange.value = Math.round(initialScale * 100);
                    rotateRange.value = 0;
                    document.getElementById('zoomVal').innerText = Math.round(initialScale * 100);
                    document.getElementById('rotateVal').innerText = 0;

                    downloadBtn.removeAttribute('disabled');
                    drawComposite();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // জুম ও রোটেট কন্ট্রোল
        zoomRange.addEventListener('input', function(e) {
            imgState.scale = parseFloat(e.target.value) / 100;
            document.getElementById('zoomVal').innerText = e.target.value;
            drawComposite();
        });

        rotateRange.addEventListener('input', function(e) {
            imgState.rotation = parseInt(e.target.value);
            document.getElementById('rotateVal').innerText = e.target.value;
            drawComposite();
        });

        // মাউস ও মোবাইল টাচ দিয়ে ছবি সরানোর সুবিধা
        let dragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => {
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!dragging || !userImage) return;
            const rect = canvas.getBoundingClientRect();
            const scaleFactor = CANVAS_SIZE / rect.width;
            
            imgState.offsetX += (e.clientX - lastX) * scaleFactor;
            imgState.offsetY += (e.clientY - lastY) * scaleFactor;
            lastX = e.clientX;
            lastY = e.clientY;
            drawComposite();
        });

        window.addEventListener('mouseup', () => { dragging = false; });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                dragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!dragging || !userImage || e.touches.length !== 1) return;
            const rect = canvas.getBoundingClientRect();
            const scaleFactor = CANVAS_SIZE / rect.width;

            imgState.offsetX += (e.touches[0].clientX - lastX) * scaleFactor;
            imgState.offsetY += (e.touches[0].clientY - lastY) * scaleFactor;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            drawComposite();
        }, { passive: false });

        window.addEventListener('touchend', () => { dragging = false; });

        // ডাউনলোড বাটন
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'Kendrio-Shommelon-2027-Profile.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });

        window.onload = function() {
            loadFrame();
        };
    </script>
</body>
</html>

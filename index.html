<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অটো ফ্রেম মেকার - কেন্দ্রীয় সম্মেলন ২০২৭</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #0b2545;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }

        /* Canvas Wrapper */
        .canvas-container {
            position: relative;
            width: 320px;
            height: 320px;
            background: #fff;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Controls */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-upload-btn {
            background: #00b4d8;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .file-upload-btn:hover {
            background: #0096c7;
        }

        #imageInput {
            display: none;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .slider-group label {
            min-width: 60px;
            font-weight: 600;
            color: #555;
        }

        .slider-group input[type="range"] {
            flex: 1;
            accent-color: #00b4d8;
        }

        .download-btn {
            background: #2ec4b6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .download-btn:hover {
            background: #25a194;
        }
    </style>
</head>
<body>

    <header>
        <h1>কেন্দ্রীয় সম্মেলন ২০২৭ - অটো ফ্রেম মেকার</h1>
    </header>

    <div class="main-container">
        <!-- Frame Preview Box -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="frameCanvas" width="1080" height="1080"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls">
            <label for="imageInput" class="file-upload-btn">
                📷 আপনার ছবি নির্বাচন করুন
            </label>
            <input type="file" id="imageInput" accept="image/*">

            <div class="slider-group">
                <label>জুম:</label>
                <input type="range" id="zoomRange" min="0.5" max="3" step="0.01" value="1">
            </div>

            <div class="slider-group">
                <label>ঘূর্ণন:</label>
                <input type="range" id="rotateRange" min="-180" max="180" step="1" value="0">
            </div>

            <button class="download-btn" id="downloadBtn">⬇ হাই-রেজোলিউশন ছবি ডাউনলোড করুন</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('frameCanvas');
        const ctx = canvas.getContext('2d');

        let userImage = null;
        let imgX = canvas.width / 2;
        let imgY = canvas.height / 2 - 80;
        let imgScale = 1;
        let imgRotate = 0;

        let isDragging = false;
        let startX, startY;

        // Circle Profile Area parameters
        const circleCenter = { x: 540, y: 410 };
        const circleRadius = 350;

        // Load default placeholder or redraw blank frame
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Background Gradient (Blue theme)
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#023e8a');
            bgGrad.addColorStop(0.5, '#0077b6');
            bgGrad.addColorStop(1, '#03045e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Decorative background patterns/shapes
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.beginPath();
            ctx.arc(900, 100, 300, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw User Image inside circle clipping mask
            ctx.save();
            ctx.beginPath();
            ctx.arc(circleCenter.x, circleCenter.y, circleRadius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            if (userImage) {
                ctx.save();
                ctx.translate(imgX, imgY);
                ctx.rotate((imgRotate * Math.PI) / 180);
                ctx.scale(imgScale, imgScale);
                ctx.drawImage(userImage, -userImage.width / 2, -userImage.height / 2);
                ctx.restore();
            } else {
                // Default placeholder avatar inside circle
                ctx.fillStyle = '#e0fbfc';
                ctx.fillRect(circleCenter.x - circleRadius, circleCenter.y - circleRadius, circleRadius * 2, circleRadius * 2);
                ctx.fillStyle = '#90e0ef';
                ctx.beginPath();
                ctx.arc(circleCenter.x, circleCenter.y - 60, 100, 0, Math.PI * 2);
                ctx.arc(circleCenter.x, circleCenter.y + 220, 180, 0, Math.PI, true);
                ctx.fill();
            }
            ctx.restore();

            // 3. Circle Border (Golden/White ring)
            ctx.beginPath();
            ctx.arc(circleCenter.x, circleCenter.y, circleRadius, 0, Math.PI * 2);
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#ffb703';
            ctx.stroke();

            // 4. Bottom Banner Background (Curved / Wave Shape)
            ctx.beginPath();
            ctx.moveTo(0, 750);
            ctx.bezierCurveTo(300, 710, 780, 710, 1080, 750);
            ctx.lineTo(1080, 1080);
            ctx.lineTo(0, 1080);
            ctx.closePath();
            
            let bannerGrad = ctx.createLinearGradient(0, 750, 0, 1080);
            bannerGrad.addColorStop(0, '#003049');
            bannerGrad.addColorStop(1, '#011627');
            ctx.fillStyle = bannerGrad;
            ctx.fill();

            // Red stripe accent
            ctx.beginPath();
            ctx.moveTo(0, 770);
            ctx.bezierCurveTo(300, 730, 780, 730, 1080, 770);
            ctx.lineTo(1080, 790);
            ctx.bezierCurveTo(780, 750, 300, 750, 0, 790);
            ctx.closePath();
            ctx.fillStyle = '#d90429';
            ctx.fill();

            // 5. Texts & Typography
            // Main Title: কেন্দ্রীয় সম্মেলন ২০২৭
            ctx.textAlign = 'center';
            ctx.font = '700 68px "Hind Siliguri", sans-serif';
            ctx.fillStyle = '#ffb703';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            ctx.shadowBlur = 10;
            ctx.fillText('কেন্দ্রীয় সম্মেলন ২০২৭', canvas.width / 2, 850);
            ctx.shadowBlur = 0; // reset shadow

            // Date & Venue Details
            ctx.font = '600 32px "Hind Siliguri", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('১১ ডিসেম্বর ’২৬, শুক্রবার, সকাল ৯টা', canvas.width / 2, 910);
            ctx.fillText('জাতীয় ক্রীড়া পরিষদ চত্বর, পল্টন, ঢাকা', canvas.width / 2, 955);

            // Organization Name (with custom matched style font look)
            ctx.font = '700 48px "Hind Siliguri", sans-serif';
            ctx.fillStyle = '#48cae4';
            ctx.fillText('ইসলামী ছাত্র আন্দোলন বাংলাদেশ', canvas.width / 2, 1025);

            // 6. Watermark at corner (icab Mirpur)
            ctx.font = '400 18px "Hind Siliguri", sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.textAlign = 'right';
            ctx.fillText('icab Mirpur', 1060, 40);
        }

        // Handle Image Upload
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        userImage = img;
                        imgScale = Math.max(circleRadius * 2 / img.width, circleRadius * 2 / img.height);
                        document.getElementById('zoomRange').value = imgScale;
                        imgX = circleCenter.x;
                        imgY = circleCenter.y;
                        imgRotate = 0;
                        document.getElementById('rotateRange').value = 0;
                        drawFrame();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Controls Event Listeners
        document.getElementById('zoomRange').addEventListener('input', function(e) {
            imgScale = parseFloat(e.target.value);
            drawFrame();
        });

        document.getElementById('rotateRange').addEventListener('input', function(e) {
            imgRotate = parseInt(e.target.value);
            drawFrame();
        });

        // Touch & Mouse Drag Interactivity for moving image inside circle
        const container = document.getElementById('canvasContainer');

        function getPos(e) {
            const rect = container.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        container.addEventListener('mousedown', startDrag);
        container.addEventListener('touchstart', startDrag);

        function startDrag(e) {
            isDragging = true;
            const pos = getPos(e);
            startX = pos.x - imgX;
            startY = pos.y - imgY;
            e.preventDefault();
        }

        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag);

        function onDrag(e) {
            if (!isDragging) return;
            const pos = getPos(e);
            imgX = pos.x - startX;
            imgY = pos.y - startY;
            drawFrame();
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function endDrag() {
            isDragging = false;
        }

        // Download High-Res Image
        document.getElementById('downloadBtn').addEventListener('click', function() {
            drawFrame();
            const link = document.createElement('a');
            link.download = 'Kendrio-Sommelon-2027-Frame.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });

        // Initial Draw
        drawFrame();
    </script>
</body>
</html>
